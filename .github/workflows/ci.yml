name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q
      # The tool must flag the known-bad fixture and stay silent on the clean one.
      - run: odoo-audit tests/fixtures/clean_addon --fail-on info
      - run: "! odoo-audit tests/fixtures/broken_pack"
